services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: hopscout
      POSTGRES_USER: hopscout
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hopscout_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hopscout -d hopscout"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  hopscout_data:
